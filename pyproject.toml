[project]
name = "trailmind"
version = "0.1.0"
description = "Behavioral AI recommendation agent"
requires-python = ">=3.9,<3.12"
dependencies = [
    "fastapi==0.104.1",
    "jinja2==3.1.2",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "openai==1.10.0",
    "langgraph==0.0.20",
    "langsmith==0.0.87",
    # Pinned explicitly (not left to transitive resolution via chromadb) — see the
    # matching comment in requirements.txt for why: chromadb 0.4.24 breaks under
    # NumPy 2.x.
    "numpy==1.26.4",
    "chromadb==0.4.24",
    "sqlalchemy==2.0.23",
    "alembic==1.13.1",
    # Postgres driver (Neon in prod — see render.yaml DATABASE_URL). psycopg2, not psycopg3,
    # so Neon's plain "postgresql://..." connection string works with SQLAlchemy's default
    # dialect as-is. Binary wheel avoids needing build tooling. Kept in sync with
    # requirements.txt, which production installs from directly.
    "psycopg2-binary==2.9.9",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "beautifulsoup4==4.12.3",
    "APScheduler==3.10.4",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "flake8==6.1.0",
]

[tool.uv]
package = false
