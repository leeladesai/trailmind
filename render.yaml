# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys TrailMind as a single web service, backed by a Neon Postgres database
# (DATABASE_URL below) plus a local Chroma vector store on this service's own disk —
# see the free-plan note below for why the split.
#
# Free plan note: Render's free web services have an EPHEMERAL filesystem — every
# redeploy (and some restarts) wipes local files back to empty. DATABASE_URL below
# points at Neon Postgres specifically so the data that actually matters (user
# accounts, catalog, events, recommendations) survives that — see the DATABASE_URL
# entry for how to set it. chroma_data/ (the vector store) is left on local ephemeral
# disk on purpose: it's just a semantic-search index derived from the catalog.
#
# KNOWN GAP: app/main.py's boot-time seed only re-upserts the demo accounts now (the
# hackathon-era mock catalog is no longer auto-seeded — see seed_data.py's
# seed_demo_accounts/seed_demo_catalog split). Nothing currently re-populates Chroma
# from Postgres's already-approved Model rows on boot, so a redeploy that wipes
# chroma_data/ will leave real tenants' approved catalogs `vector_synced=True` in SQL
# but actually missing from retrieval until each model is re-approved (or a real
# resync-from-SQL step is added). Not a new problem introduced by removing the mock
# seed — it already existed for any non-reference tenant's catalog — just newly
# visible without the mock reseed masking it for the reference tenant.
#
# Free plan also note: the service spins down after ~15 min of no traffic and takes
# ~30-60s to wake on the next request — the first hit after idle will be slow. It also
# means the DLV-3 daily digest cron (APScheduler, in-process) won't fire while asleep.
# An always-on paid plan removes both limitations.

services:
  - type: web
    name: trailmind
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    # Seeding (idempotent — upserts by email/title, never duplicates) runs as a
    # background task inside the app's own startup (see app/main.py's lifespan),
    # not as a blocking step here. It used to be `python seed_data.py && uvicorn ...`,
    # but that meant a stalled DB connection during seeding (e.g. Neon waking from
    # autosuspend) blocked uvicorn from ever binding the port — taking /health down
    # with it even though /health itself never touches the DB.
    startCommand: "uvicorn app.asgi:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      # Makes create_app fail fast if SECRET_KEY below is ever left unset/default
      # instead of silently signing admin JWTs with the value published in this repo.
      - key: APP_ENV
        value: production
      # Random, unique per deploy — do not reuse the local-dev SECRET_KEY.
      - key: SECRET_KEY
        generateValue: true
      # A public HTTPS deployment should mark the session cookie Secure (HTTPS-only);
      # the local-dev default stays False so http://localhost keeps working unchanged.
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # Neon Postgres pooled connection string (postgresql://user:pass@ep-xxxx-pooler.
      # region.aws.neon.tech/dbname?sslmode=require) — pooled, not direct, since Render
      # makes short-lived connections per request. Falls back to local SQLite
      # (app/config.py) if unset, which is fine for local dev but NOT for this
      # deployment (see the free-plan note above for why).
      - key: DATABASE_URL
        sync: false
      # --- Secrets: set these in the Render dashboard after the blueprint is created,
      # never commit real values here. `sync: false` means "required, but not stored
      # in this file" — Render will prompt for each on first deploy. ---
      - key: MESH_API_KEY
        sync: false
      - key: MESH_MODEL
        value: openai/gpt-4.1-nano
      - key: MESH_EMBEDDING_MODEL
        value: google/embeddinggemma-300m
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: trailmind
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DIGEST_CRON_HOUR
        value: "9"
      - key: DIGEST_CRON_MINUTE
        value: "0"
      # APP_BASE_URL powers the "View full dashboard" link in the digest email.
      # Left unset here on purpose: app/services/digest.py falls back to Render's own
      # auto-injected RENDER_EXTERNAL_URL when this isn't set, so it's correct by
      # default with zero manual step. Only set this explicitly if you attach a custom
      # domain and want the email to link there instead of the onrender.com URL.

    # Persistent disk for chroma_data/ too (optional, requires a paid instance type —
    # uncomment and set `plan:` above to `starter` or higher). Without it, the vector
    # store stays ephemeral and reseeds from the (now-persistent) Postgres catalog on
    # every boot, which is intentionally fine — see the free-plan note above.
    # disk:
    #   name: trailmind-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # With the disk mounted, also uncomment this so the vector store lives on it
    # instead of the ephemeral app directory:
    # envVars (add to the list above):
    #   - key: CHROMA_DB_PATH
    #     value: /var/data/chroma_data
